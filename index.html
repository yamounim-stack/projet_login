<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>LOGIN - PAGE</title>
</head>
<body>
     <div class="form">
        <h1> Sign up</h1>
        <input id="nom" placeholder="entrer votre nom : " type="text">
        <input id="email" placeholder="entrer votre email : " type="email">
        <input id="password" placeholder="entrer votre mot de passe : " type="password">
        <button id="btn">S'inscrire</button>
     </div>

     <div class="form">
        <h1> Login</h1>
        <input id="login-email" placeholder="entrer votre email : " type="email">
        <input id="login-password" placeholder="entrer votre mot de passe : " type="password">
        <button id="login-btn">Se connecter</button>
     </div>
     <!-- PAGE BIENVENUE -->
    <div class="page" id="page-welcome" style="display:none">
    <div class="form">
        <h1>🎉</h1>
        <h2>Bienvenue sur le site de Yassmine !</h2>
        <p>Vous êtes connecté avec succès.</p>
       <button onclick="showPage('page-login')">Se déconnecter</button>
    </div>
</div>

     <script src="./index.js"></script>
</body>
</html>
